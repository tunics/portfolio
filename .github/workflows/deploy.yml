name: Deploy to Hostinger

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: hostinger-production
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    deploy:
        name: Build and deploy
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Validate configuration
              env:
                  PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
                  FTP_SERVER: ${{ secrets.FTP_SERVER }}
                  FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
                  FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
              run: |
                  [[ "$PUBLIC_GA_MEASUREMENT_ID" =~ ^G-[A-Z0-9]+$ ]] || { echo "::error::Configure the PUBLIC_GA_MEASUREMENT_ID repository variable."; exit 1; }
                  [[ -n "$FTP_SERVER" ]] || { echo "::error::Configure the FTP_SERVER repository secret."; exit 1; }
                  [[ -n "$FTP_USERNAME" ]] || { echo "::error::Configure the FTP_USERNAME repository secret."; exit 1; }
                  [[ -n "$FTP_PASSWORD" ]] || { echo "::error::Configure the FTP_PASSWORD repository secret."; exit 1; }

            - name: Build website
              run: npm run build
              env:
                  PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}

            - name: Deploy dist to Hostinger
              uses: SamKirkland/FTP-Deploy-Action@v4.4.0
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  protocol: ftp
                  port: 21
                  local-dir: ./dist/
                  server-dir: ./public_html/
                  log-level: minimal
